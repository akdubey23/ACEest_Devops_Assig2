apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-api
  namespace: aceest
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-fitness-api
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        track: stable
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:v3.2.4
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
