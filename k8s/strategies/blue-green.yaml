apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest
  labels:
    app: aceest-fitness-api
    color: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-api
      color: blue
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        color: blue
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:v3.2.4
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  namespace: aceest
  labels:
    app: aceest-fitness-api
    color: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-api
      color: green
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        color: green
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:next
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-blue-green
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness-api
    color: blue
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30081
