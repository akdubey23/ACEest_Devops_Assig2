apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-primary
  namespace: aceest
  labels:
    app: aceest-fitness-api
    role: primary
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-api
      role: primary
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        role: primary
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:v3.2.4
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-shadow
  namespace: aceest
  labels:
    app: aceest-fitness-api
    role: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-api
      role: shadow
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        role: shadow
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:next
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-primary
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness-api
    role: primary
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30083
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-shadow
  namespace: aceest
spec:
  selector:
    app: aceest-fitness-api
    role: shadow
  ports:
    - name: http
      port: 80
      targetPort: 5000
