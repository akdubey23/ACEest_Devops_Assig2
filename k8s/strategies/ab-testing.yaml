apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-a
  namespace: aceest
  labels:
    app: aceest-fitness-api
    variant: a
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-api
      variant: a
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        variant: a
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:v3.2.4
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-variant-b
  namespace: aceest
  labels:
    app: aceest-fitness-api
    variant: b
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-fitness-api
      variant: b
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        variant: b
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-a
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness-api
    variant: a
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30084
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-variant-b
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness-api
    variant: b
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30085
