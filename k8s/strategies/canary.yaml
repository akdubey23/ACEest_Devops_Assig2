apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
  namespace: aceest
  labels:
    app: aceest-fitness-api
    release: stable
spec:
  replicas: 4
  selector:
    matchLabels:
      app: aceest-fitness-api
      release: stable
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        release: stable
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:v3.2.4
          ports:
            - containerPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest
  labels:
    app: aceest-fitness-api
    release: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aceest-fitness-api
      release: canary
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        release: canary
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-canary
  namespace: aceest
spec:
  type: NodePort
  selector:
    app: aceest-fitness-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30082
