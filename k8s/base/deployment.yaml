apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-api
  namespace: aceest
  labels:
    app: aceest-fitness-api
    version: v3-2-4
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-fitness-api
      track: stable
  template:
    metadata:
      labels:
        app: aceest-fitness-api
        track: stable
        version: v3-2-4
    spec:
      containers:
        - name: aceest-fitness-api
          image: docker.io/akanksha2402/aceest-fitness-api:v3.2.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: ACEEST_DB_PATH
              value: /tmp/aceest_fitness.db
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
