name: CI

on:
  push:
  pull_request:

jobs:
  build-test-docker:
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Syntax check (compile)
        run: python -m compileall -q app.py

      - name: Run tests
        run: |
          mkdir -p test-results allure-results
          python -m pytest tests/ -v --tb=short \
            --junitxml=test-results/junit.xml \
            --alluredir=allure-results \
            --cov=app --cov-report=xml:test-results/coverage.xml \
            --html=test-results/pytest-report.html --self-contained-html
          python scripts/build_test_dashboard.py

      - name: SonarQube scan
        if: ${{ env.SONAR_HOST_URL != '' && env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            test-results/
            allure-results/

      - name: Build Docker test image
        run: docker build --target test -t aceest-fitness-api:test .

      - name: Build Docker image
        run: docker build --target runtime -t aceest-fitness-api:ci .

      - name: Login to Docker Hub
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        run: |
          IMAGE="docker.io/${{ env.DOCKERHUB_USERNAME }}/aceest-fitness-api"
          docker tag aceest-fitness-api:ci "$IMAGE:${{ github.run_number }}"
          docker tag aceest-fitness-api:ci "$IMAGE:latest"
          docker push "$IMAGE:${{ github.run_number }}"
          docker push "$IMAGE:latest"
